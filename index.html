<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bushra's Schedule</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    :root {
        --forest: #344b3d;
        --sage: #718b78;
        --sage-dark: #587061;
        --sage-light: #edf3ee;
        --mint: #f4f7f4;
        --cream: #fafaf7;
        --white: #ffffff;
        --text: #344039;
        --muted: #7b867f;
        --border: #e2e8e2;
        --green-online: #799b84;
    }

    body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont,
                     "Segoe UI", Arial, sans-serif;
        background: var(--cream);
        color: var(--text);
        min-height: 100vh;
    }

    /* SUBTLE GREENERY */

    body::before {
        content: "";
        position: fixed;
        width: 280px;
        height: 280px;
        top: -100px;
        right: -100px;
        background: #edf3ed;
        border-radius: 50%;
        opacity: 0.65;
        z-index: -1;
    }

    body::after {
        content: "";
        position: fixed;
        width: 220px;
        height: 220px;
        bottom: -100px;
        left: -80px;
        background: #f0f5f0;
        border-radius: 50%;
        opacity: 0.7;
        z-index: -1;
    }

    .container {
        width: min(1050px, 92%);
        margin: auto;
        padding: 38px 0 55px;
    }

    /* HEADER */

    header {
        margin-bottom: 25px;
    }

    .eyebrow {
        color: var(--sage-dark);
        font-size: 11px;
        font-weight: 750;
        text-transform: uppercase;
        letter-spacing: 1.6px;
        margin-bottom: 8px;
    }

    h1 {
        color: var(--forest);
        font-size: clamp(31px, 5vw, 44px);
        font-weight: 720;
        letter-spacing: -1.4px;
        line-height: 1.05;
    }

    .date {
        margin-top: 9px;
        color: var(--muted);
        font-size: 14px;
    }

    /* TABS */

    .tabs {
        display: flex;
        gap: 5px;
        width: fit-content;
        padding: 5px;
        background: #edf1ed;
        border: 1px solid var(--border);
        border-radius: 12px;
        margin-bottom: 25px;
    }

    .tab {
        border: none;
        background: transparent;
        color: #7a857d;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 650;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .tab:hover {
        color: var(--forest);
        background: #f7f9f7;
    }

    .tab.active {
        background: var(--white);
        color: var(--forest);
        box-shadow: 0 2px 8px rgba(55, 75, 62, 0.08);
    }

    /* SECTION */

    .section-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 13px;
    }

    .section-heading h2 {
        color: var(--forest);
        font-size: 19px;
        font-weight: 700;
    }

    .section-heading span {
        color: var(--muted);
        font-size: 12px;
    }

    /* TODAY CARD */

    .today-card {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 17px;
        overflow: hidden;
        box-shadow: 0 7px 25px rgba(54, 72, 59, 0.045);
    }

    .today-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 23px;
        border-bottom: 1px solid var(--border);
    }

    .today-top h3 {
        color: var(--forest);
        font-size: 19px;
        font-weight: 700;
    }

    .today-label {
        color: var(--sage-dark);
        background: var(--sage-light);
        padding: 6px 9px;
        border-radius: 6px;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.7px;
    }

    .classes {
        padding: 15px;
    }

    /* CLASS CARD */

    .class-card {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
        padding: 18px;
        margin-bottom: 10px;
        background: #ffffff;
        border: 1px solid var(--border);
        border-left: 4px solid var(--sage);
        border-radius: 12px;
        transition: 0.2s ease;
    }

    .class-card:last-child {
        margin-bottom: 0;
    }

    .class-card:hover {
        transform: translateY(-1px);
        box-shadow: 0 5px 16px rgba(55, 75, 62, 0.06);
    }

    .class-card.online {
        border-left-color: var(--green-online);
    }

    .class-name {
        color: var(--text);
        font-size: 16px;
        font-weight: 700;
    }

    .class-time {
        color: var(--muted);
        font-size: 13px;
        margin-top: 5px;
    }

    .location {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font-size: 12px;
        margin-top: 10px;
    }

    .location-icon {
        width: 14px;
        height: 14px;
        color: var(--sage-dark);
    }

    .badge {
        white-space: nowrap;
        padding: 6px 9px;
        border-radius: 6px;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.5px;
    }

    .badge.physical {
        color: var(--sage-dark);
        background: var(--sage-light);
    }

    .badge.online {
        color: #64856e;
        background: #eef5ef;
    }

    /* EMPTY */

    .empty {
        text-align: center;
        padding: 42px 20px;
    }

    .empty-icon {
        width: 43px;
        height: 43px;
        margin: 0 auto 13px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--sage-light);
        color: var(--sage-dark);
        font-size: 19px;
        font-weight: 700;
    }

    .empty h3 {
        color: var(--forest);
        font-size: 16px;
        margin-bottom: 5px;
    }

    .empty p {
        color: var(--muted);
        font-size: 13px;
    }

    /* NEXT CLASS */

    .next-class {
        margin-top: 18px;
        padding: 20px 23px;
        background: var(--forest);
        color: white;
        border-radius: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
    }

    .next-label {
        color: #b8cfbd;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 6px;
    }

    .next-class h3 {
        font-size: 17px;
        margin-bottom: 5px;
    }

    .next-class p {
        color: #d6e0d8;
        font-size: 12px;
    }

    .next-arrow {
        color: #b8cfbd;
        font-size: 23px;
    }

    /* WEEKLY */

    .weekly-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
    }

    .day-card {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px;
        box-shadow: 0 5px 18px rgba(55, 75, 62, 0.035);
    }

    .day-card.today {
        border: 2px solid var(--sage);
        padding: 17px;
    }

    .day-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
    }

    .day-name {
        color: var(--forest);
        font-size: 16px;
        font-weight: 700;
    }

    .today-mini {
        color: var(--sage-dark);
        background: var(--sage-light);
        padding: 5px 7px;
        border-radius: 5px;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.5px;
    }

    .weekly-class {
        background: #f8faf8;
        border: 1px solid #e8ede8;
        border-radius: 10px;
        padding: 13px;
        margin-bottom: 8px;
    }

    .weekly-class:last-child {
        margin-bottom: 0;
    }

    .weekly-class-name {
        color: var(--text);
        font-size: 13px;
        font-weight: 700;
    }

    .weekly-class-time {
        color: var(--muted);
        font-size: 11px;
        margin-top: 4px;
    }

    .weekly-location {
        color: #8a958d;
        font-size: 10px;
        margin-top: 6px;
    }

    .study-day {
        background: #f7faf7;
        color: #87938a;
        padding: 14px;
        border-radius: 10px;
        text-align: center;
        font-size: 12px;
    }

    /* LEGEND */

    .legend {
        display: flex;
        gap: 20px;
        margin-top: 18px;
        color: var(--muted);
        font-size: 11px;
    }

    .legend-item {
        display: flex;
        align-items: center;
        gap: 7px;
    }

    .legend-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
    }

    .physical-dot {
        background: var(--sage);
    }

    .online-dot {
        background: var(--green-online);
    }

    .hidden {
        display: none;
    }

    /* MOBILE */

    @media (max-width: 700px) {

        .container {
            width: 94%;
            padding-top: 24px;
        }

        .tabs {
            width: 100%;
        }

        .tab {
            flex: 1;
        }

        .class-card {
            display: block;
        }

        .badge {
            display: inline-block;
            margin-top: 12px;
        }

        .weekly-grid {
            grid-template-columns: 1fr;
        }

        .next-class {
            align-items: flex-start;
        }
    }
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <header>

        <div class="eyebrow">Weekly Study Planner</div>

        <h1>Bushra's Classes</h1>

        <div class="date" id="currentDate"></div>

    </header>


    <!-- TABS -->

    <div class="tabs">

        <button
            class="tab active"
            onclick="showTab('today', this)">
            Today
        </button>

        <button
            class="tab"
            onclick="showTab('weekly', this)">
            Weekly Schedule
        </button>

    </div>


    <!-- TODAY -->

    <section id="todaySection">

        <div class="section-heading">

            <h2>Today's Schedule</h2>

            <span id="classCount"></span>

        </div>


        <div class="today-card">

            <div class="today-top">

                <h3 id="todayName"></h3>

                <div class="today-label">
                    TODAY
                </div>

            </div>

            <div class="classes" id="todayClasses"></div>

        </div>


        <div id="nextClass"></div>

    </section>


    <!-- WEEKLY -->

    <section id="weeklySection" class="hidden">

        <div class="section-heading">

            <h2>Weekly Schedule</h2>

            <span>All classes</span>

        </div>


        <div class="weekly-grid" id="weeklyGrid"></div>


        <div class="legend">

            <div class="legend-item">
                <span class="legend-dot physical-dot"></span>
                Physical class
            </div>

            <div class="legend-item">
                <span class="legend-dot online-dot"></span>
                Online class
            </div>

        </div>

    </section>

</div>


<script>

const schedule = {

    Monday: [],

    Tuesday: [
        {
            name: "Business Studies",
            time: "4:00 PM – 7:00 PM",
            location: "Sigma Institute",
            type: "physical"
        }
    ],

    Wednesday: [
        {
            name: "Accounting Revision",
            time: "3:00 PM – 7:00 PM",
            location: "Online",
            type: "online"
        }
    ],

    Thursday: [],

    Friday: [
        {
            name: "Business Studies Revision",
            time: "3:00 PM – 6:00 PM",
            location: "Sigma Institute",
            type: "physical"
        }
    ],

    Saturday: [
        {
            name: "Accounting",
            time: "2:30 PM – 6:30 PM",
            location: "Online",
            type: "online"
        },
        {
            name: "ICT Paper Discussion",
            time: "8:30 PM onwards",
            location: "Online",
            type: "online"
        }
    ],

    Sunday: [
        {
            name: "ICT",
            time: "2:00 PM – 7:00 PM",
            location: "Sigma Institute",
            type: "physical"
        }
    ]

};


const days = [
    "Monday",
    "Tuesday",
    "Wednesday",
    "Thursday",
    "Friday",
    "Saturday",
    "Sunday"
];


function getToday() {

    const dayNumber = new Date().getDay();

    return days[dayNumber === 0 ? 6 : dayNumber - 1];

}


function formatDate() {

    return new Date().toLocaleDateString("en-GB", {

        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"

    });

}


function locationIcon(type) {

    if (type === "online") {

        return `
            <svg class="location-icon"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2">

                <rect x="3" y="5"
                      width="18"
                      height="14"
                      rx="2"></rect>

                <path d="M8 21h8"></path>
                <path d="M12 19v2"></path>

            </svg>
        `;

    }

    return `
        <svg class="location-icon"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2">

            <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"></path>

            <circle cx="12"
                    cy="10"
                    r="2.5"></circle>

        </svg>
    `;

}


function classHTML(item) {

    return `

        <div class="class-card ${item.type}">

            <div>

                <div class="class-name">
                    ${item.name}
                </div>

                <div class="class-time">
                    ${item.time}
                </div>

                <div class="location">

                    ${locationIcon(item.type)}

                    ${item.location}

                </div>

            </div>


            <div class="badge ${item.type}">

                ${
                    item.type === "online"
                    ? "ONLINE"
                    : "IN PERSON"
                }

            </div>

        </div>

    `;

}


function displayToday() {

    const today = getToday();

    const classes = schedule[today];

    document.getElementById("todayName").textContent = today;

    document.getElementById("classCount").textContent =
        classes.length === 0
        ? "No classes"
        : `${classes.length} ${classes.length === 1 ? "class" : "classes"}`;


    const container =
        document.getElementById("todayClasses");


    if (classes.length === 0) {

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ✓
                </div>

                <h3>No classes today</h3>

                <p>
                    A good day to focus on AAT studies.
                </p>

            </div>

        `;

    } else {

        container.innerHTML =
            classes.map(classHTML).join("");

    }

}


function findNextClass() {

    const todayIndex =
        days.indexOf(getToday());


    for (let i = 1; i <= 7; i++) {

        const index =
            (todayIndex + i) % 7;

        const day = days[index];


        if (schedule[day].length > 0) {

            const next =
                schedule[day][0];


            document.getElementById("nextClass").innerHTML = `

                <div class="next-class">

                    <div>

                        <div class="next-label">
                            Next class
                        </div>

                        <h3>
                            ${next.name}
                        </h3>

                        <p>
                            ${day} · ${next.time} · ${next.location}
                        </p>

                    </div>

                    <div class="next-arrow">
                        →
                    </div>

                </div>

            `;

            return;

        }

    }

}


function buildWeekly() {

    const today = getToday();

    const grid =
        document.getElementById("weeklyGrid");


    grid.innerHTML = days.map(day => {

        const classes =
            schedule[day];


        return `

            <div class="day-card ${day === today ? "today" : ""}">

                <div class="day-header">

                    <div class="day-name">
                        ${day}
                    </div>

                    ${
                        day === today
                        ? `<div class="today-mini">TODAY</div>`
                        : ""
                    }

                </div>


                ${
                    classes.length

                    ? classes.map(item => `

                        <div class="weekly-class">

                            <div class="weekly-class-name">
                                ${item.name}
                            </div>

                            <div class="weekly-class-time">
                                ${item.time}
                            </div>

                            <div class="weekly-location">

                                ${item.type === "online" ? "▣" : "⌖"}

                                ${item.location}

                            </div>

                        </div>

                    `).join("")

                    : `

                        <div class="study-day">
                            AAT study day
                        </div>

                    `
                }

            </div>

        `;

    }).join("");

}


function showTab(tab, button) {

    document
        .querySelectorAll(".tab")
        .forEach(btn =>
            btn.classList.remove("active")
        );


    button.classList.add("active");


    document
        .getElementById("todaySection")
        .classList.toggle(
            "hidden",
            tab !== "today"
        );


    document
        .getElementById("weeklySection")
        .classList.toggle(
            "hidden",
            tab !== "weekly"
        );

}


document.getElementById("currentDate")
    .textContent = formatDate();


displayToday();

findNextClass();

buildWeekly();

</script>

</body>
</html>
